name: Build Android and iOS
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm install -g eas-cli
      - name: Build Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --local --platform android --profile preview --non-interactive --output=app.apk
      - run: ls -lah
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app.apk

  build-android-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm install -g eas-cli
      - name: Build Android AAB
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --local --platform android --profile production --non-interactive --output=app.aab
      - run: ls -lah
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: app.aab

  build-ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm install -g eas-cli
      - name: Build iOS Simulator
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --local --platform ios --profile preview --non-interactive --output=app.tar.gz
      - run: ls -lah
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: app.tar.gz

  upload-appetize:
    needs: build-android-apk
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
      - name: Upload to Appetize
        id: upload
        run: |
          RESPONSE=$(curl --fail-with-body -s \
            --connect-timeout 30 \
            --max-time 120 \
            -F "file=@app.apk" \
            -F "platform=android" \
            "https://${{ secrets.APPETIZE_API_TOKEN }}@api.appetize.io/v1/apps")

          PUBLIC_KEY=$(echo "$RESPONSE" | jq -r '.publicKey')

          if [ -z "$PUBLIC_KEY" ] || [ "$PUBLIC_KEY" = "null" ]; then
            echo "::warning::Failed to parse publicKey from Appetize response"
            echo "Response: $RESPONSE"
            exit 1
          fi

          echo "public_key=$PUBLIC_KEY" >> $GITHUB_OUTPUT

          APP_URL="https://appetize.io/app/$PUBLIC_KEY"
          echo "app_url=$APP_URL" >> $GITHUB_OUTPUT

          {
            echo "### :iphone: Appetize Preview"
            echo ""
            echo "[Open in Appetize]($APP_URL)"
            echo ""
            echo "Public Key: `$PUBLIC_KEY`"
          } >> $GITHUB_STEP_SUMMARY
