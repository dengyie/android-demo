name: Build Android and iOS
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm install -g eas-cli
      - name: Build and collect artifacts
        run: |
          mkdir -p ./artifacts
          eas build --local --platform android --profile preview --non-interactive --output ./artifacts/app-release.apk
          echo "=== Artifacts collected ==="
          ls -la ./artifacts/
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: ./artifacts/
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm install -g eas-cli
      - name: Build and collect artifacts
        run: |
          mkdir -p ./artifacts
          eas build --local --platform ios --profile preview --non-interactive --output ./artifacts/ios-build.tar.gz
          echo "=== Artifacts collected ==="
          ls -la ./artifacts/
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ./artifacts/
