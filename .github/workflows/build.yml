name: Build Android and iOS
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm install -g eas-cli
      - name: Build Android APK
        run: eas build --local --platform android --profile preview --non-interactive --output=app.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - run: ls -lah
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app.apk

  build-android-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm install -g eas-cli
      - name: Build Android AAB
        run: eas build --local --platform android --profile production --non-interactive --output=app.aab
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - run: ls -lah
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: app.aab

  build-ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm install -g eas-cli
      - name: Build iOS Simulator
        run: eas build --local --platform ios --profile preview --non-interactive --output=app.tar.gz
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - run: ls -lah
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: app.tar.gz
