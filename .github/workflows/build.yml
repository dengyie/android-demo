name: Build Android and iOS
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm install -g eas-cli
      - run: eas build --local --platform android --profile preview --non-interactive --output=./build-output
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - run: |
          mkdir -p ./artifacts
          find /tmp/runner -name "*.apk" -exec cp {} ./artifacts/ \; 2>/dev/null || true
          find ./build-output -name "*.apk" -exec cp {} ./artifacts/ \; 2>/dev/null || true
          ls -la ./artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ./artifacts/*.apk
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm install -g eas-cli
      - run: eas build --local --platform ios --profile preview --non-interactive --output=./build-output
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - run: |
          mkdir -p ./artifacts
          find /var/folders -name "*.app" -exec cp -r {} ./artifacts/ \; 2>/dev/null || true
          find ./build-output -name "*.app" -exec cp -r {} ./artifacts/ \; 2>/dev/null || true
          ls -la ./artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: ./artifacts/*.app
